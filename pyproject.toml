[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spillway-guard"
version = "0.1.3"
description = "Prompt-injection defense for tool-using LLM agents: a typed-identity egress floor, a rule-based ingress sanitizer, and an optional local judge"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SAINT Machines" }]
keywords = [
  "prompt-injection",
  "llm-agents",
  "tool-use",
  "agent-security",
  "agentdojo",
  "egress-control",
  "sanitizer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
# pydantic: the floor reads the typed objects tools return. PyYAML: the same text for the judge and the floor.
# 2.10 is the first release whose JSON schema carries propertyNames, which marks a dict key as an identity.
dependencies = ["pydantic>=2.10", "PyYAML>=6.0.1"]

[project.optional-dependencies]
# Runs the gate as an AgentDojo pipeline element (the setting the paper evaluates).
agentdojo = ["agentdojo>=0.1.35"]
# email-validator: pydantic needs it for EmailStr, so the two EmailStr tests in tests/test_floor.py run.
dev = ["pytest>=8", "ruff>=0.5", "email-validator>=2.0"]

[project.urls]
Homepage = "https://saintmachines.github.io/spillway/"
Documentation = "https://saintmachines.github.io/spillway/integrate.html"
Paper = "https://arxiv.org/abs/2611.07222"
Repository = "https://github.com/saintmachines/spillway"
Issues = "https://github.com/saintmachines/spillway/issues"
Changelog = "https://github.com/saintmachines/spillway/blob/main/CHANGELOG.md"

[project.scripts]
spillway-agentdojo = "spillway_guard.agentdojo.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spillway_guard"]

[tool.hatch.build.targets.sdist]
# Scratch, CI config and the project page are not part of the source distribution;
# benchmarks/ and reference/ stay in so the sdist carries the paper's artifacts.
exclude = ["/_work", "/.github", "/docs"]
skip-excluded-dirs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "differential: compares the packaged floor with reference/spillway_gate.py on synthetic tool messages and typed models; needs the agentdojo extra",
]
