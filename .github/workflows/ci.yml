name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q -m "not differential"

  differential:
    name: differential tests against the reference gate (agentdojo extra)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (dev and agentdojo extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,agentdojo]"
      - name: Differential tests
        # Runs synthetic tool messages and typed models through the packaged floor and
        # through reference/spillway_gate.py. Decisions must match. Exit code 5 (nothing
        # collected) fails the job on purpose: a differential job that runs no test
        # proves nothing. SPW_REQUIRE_DIFFERENTIAL=1 turns the skip for a missing
        # agentdojo or reference tree into a failure, so three skips cannot pass either.
        env:
          SPW_REQUIRE_DIFFERENTIAL: "1"
        run: pytest -q -m differential

  artifacts:
    name: tables and page match the result files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Tables match the paper and the committed TABLES.md
        run: |
          python benchmarks/scripts/make_tables.py --out benchmarks/TABLES.md
          git diff --exit-code benchmarks/TABLES.md
      - name: Page build (checks pinned hashes and paper values)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          python docs/_build/build_page.py --out "$RUNNER_TEMP/site/index.html"

  package:
    name: build and check the distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          python -c "import spillway_guard; print('spillway_guard', getattr(spillway_guard, '__version__', 'imported'))"
      - name: Local app boundary integration
        # Run outside the checkout so imports come from the installed wheel.
        # The fixture uses only localhost, synthetic data and fixed proposals.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import spillway_guard; print(spillway_guard.__file__)"
          python "$GITHUB_WORKSPACE/docs/examples/local_app_demo.py" --report "$RUNNER_TEMP/spillway-app-check.json"
          python "$GITHUB_WORKSPACE/docs/examples/collection_demo.py" --report "$RUNNER_TEMP/spillway-collection-check.json"
