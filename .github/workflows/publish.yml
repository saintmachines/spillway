name: Publish spillway-guard

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified frozen 0.1.3 distributions to PyPI
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-spillway-0.1.3
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the frozen release distributions
    if: github.repository == 'saintmachines/spillway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download and verify the existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          repo = 'saintmachines/spillway'
          commit = '6b0380ab258b0f84f880171ff5e1ffa18db98be7'
          tag_object = 'a3f97744a209cfccfc74a4d349cf69d22706e13a'
          expected = {
              'spillway_guard-0.1.3-py3-none-any.whl': {
                  'id': 745489635,
                  'size': 74321,
                  'sha256': '4705fe784f9db02ad38c08ec42b010a37c2aa7ec80c24d741aac5626ea04a4d8',
              },
              'spillway_guard-0.1.3.tar.gz': {
                  'id': 745489657,
                  'size': 327038,
                  'sha256': '7a137ab17f4376560b19156ff9dd523368f220f02f80a5a525636c49886b3cf2',
              },
          }

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))

          ref = api('/git/ref/tags/v0.1.3')['object']
          assert ref['type'] == 'tag' and ref['sha'] == tag_object, 'The frozen tag changed'
          tag = api('/git/tags/' + tag_object)
          assert tag['tag'] == 'v0.1.3' and tag['object']['sha'] == commit, 'The frozen commit changed'
          release = api('/releases/444822017')
          assert release['id'] == 444822017 and release['tag_name'] == 'v0.1.3'
          assert release['target_commitish'] == commit, 'The release target changed'
          assets = {asset['name']: asset for asset in release['assets']}
          dist = Path('dist')
          dist.mkdir()
          for name, record in expected.items():
              asset = assets[name]
              assert asset['id'] == record['id'] and asset['size'] == record['size'], name
              assert asset['digest'] == 'sha256:' + record['sha256'], name
              with (dist / name).open('wb') as output:
                  subprocess.run([
                      'gh', 'api', 'repos/' + repo + '/releases/assets/' + str(record['id']),
                      '--header', 'Accept: application/octet-stream',
                  ], stdout=output, check=True)
              raw = (dist / name).read_bytes()
              assert len(raw) == record['size'] and hashlib.sha256(raw).hexdigest() == record['sha256'], name
          assert {path.name for path in dist.iterdir()} == set(expected)
          print('Verified v0.1.3', commit, 'and both existing distribution hashes; no rebuild')
          PY
      - name: Check both package descriptions
        run: |
          python -m pip install --disable-pip-version-check 'twine>=7'
          python -m twine check --strict dist/spillway_guard-0.1.3-py3-none-any.whl dist/spillway_guard-0.1.3.tar.gz
      - name: Verify a fresh wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/spillway-install"
          "$RUNNER_TEMP/spillway-install/bin/python" -m pip --isolated install --index-url https://pypi.org/simple dist/spillway_guard-0.1.3-py3-none-any.whl
          "$RUNNER_TEMP/spillway-install/bin/python" -m pip check
          "$RUNNER_TEMP/spillway-install/bin/python" -I - <<'PY'
          import hashlib
          from importlib.metadata import version
          import json
          from pathlib import Path
          import sys
          import zipfile

          import spillway_guard
          from spillway_guard import Guard, Policy

          package = Path(spillway_guard.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix)), 'Import must come from the fresh installation'
          assert version('spillway-guard') == '0.1.3'
          assert not Policy().escalate_mv and Policy().mv_integrity
          with zipfile.ZipFile('dist/spillway_guard-0.1.3-py3-none-any.whl') as archive:
              members = [name for name in archive.namelist() if name.startswith('spillway_guard/')]
              for name in members:
                  installed = (package.parent.parent / name).read_bytes()
                  assert hashlib.sha256(installed).digest() == hashlib.sha256(archive.read(name)).digest(), name
          guard = Guard('Reply to colleague@trusted.example about the project.')
          guard.observe_text('outsider@untrusted.example')
          assert guard.check_call('send_email', {'recipients': ['colleague@trusted.example'], 'body': 'hello'}).allowed
          assert guard.check_call('send_email', {'recipients': ['outsider@untrusted.example'], 'body': 'hello'}).blocked
          print(json.dumps({'package': str(package), 'version': version('spillway-guard'), 'wheel_members_verified': len(members), 'model_calls': 0}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish using the registered PyPI Trusted Publisher
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spillway-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-distributions
          path: dist/
      - name: Recheck the exact files before upload
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'spillway_guard-0.1.3-py3-none-any.whl': '4705fe784f9db02ad38c08ec42b010a37c2aa7ec80c24d741aac5626ea04a4d8',
              'spillway_guard-0.1.3.tar.gz': '7a137ab17f4376560b19156ff9dd523368f220f02f80a5a525636c49886b3cf2',
          }
          files = {path.name: path for path in Path('dist').iterdir()}
          assert set(files) == set(expected)
          for name, digest in expected.items():
              assert files[name].is_file() and hashlib.sha256(files[name].read_bytes()).hexdigest() == digest, name
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
