name: Publish spillway-guard

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the frozen, reviewed 1.1.0 files
        default: false
        type: boolean
      expected_commit:
        required: true
        type: string
      tag_object_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      wheel_asset_id:
        required: true
        type: string
      sdist_asset_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-spillway-1.1.0
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'saintmachines/spillway' && github.ref == 'refs/heads/release/1.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Fetch immutable-tag release files and verify the reviewed bytes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EVENT_COMMIT: ${{ github.sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          WHEEL_ASSET_ID: ${{ inputs.wheel_asset_id }}
          SDIST_ASSET_ID: ${{ inputs.sdist_asset_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          repo = 'repos/saintmachines/spillway/'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', repo + path]))
          commit = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          assert commit == os.environ['EVENT_COMMIT']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == commit
          ref = api('git/ref/tags/v1.1.0')['object']
          assert ref['type'] == 'tag' and ref['sha'] == os.environ['TAG_OBJECT_SHA']
          tag = api('git/tags/' + ref['sha'])
          assert tag['tag'] == 'v1.1.0' and tag['object'] == {'type': 'commit', 'sha': commit, 'url': tag['object']['url']}
          release = api('releases/' + str(int(os.environ['RELEASE_ID'])))
          assert release['tag_name'] == 'v1.1.0' and release['prerelease'] is False
          assets = {int(a['id']): a for a in release['assets']}
          expected = {
              'spillway_guard-1.1.0-py3-none-any.whl': ('WHEEL_ASSET_ID', 154268, 'a047c87853638b7faee3c4b32a36d2d8456f5db098fbdaf93416e6bb545a4209'),
              'spillway_guard-1.1.0.tar.gz': ('SDIST_ASSET_ID', 134536, '0660f75d6a8793dc86c05677c42b22cae4d9a563b7ec512f9ad46cde821946f1'),
          }
          dist = Path('dist'); dist.mkdir(exist_ok=False)
          for name, (envkey, size, digest) in expected.items():
              asset_id = int(os.environ[envkey]); asset = assets[asset_id]
              assert asset['name'] == name and asset['size'] == size
              assert asset['digest'] == 'sha256:' + digest
              body = subprocess.check_output(['gh', 'api', repo + 'releases/assets/' + str(asset_id), '-H', 'Accept: application/octet-stream'])
              assert len(body) == size and hashlib.sha256(body).hexdigest() == digest
              (dist / name).write_bytes(body)
          PY
          python release110/verify_release110.py --dist dist --project-lock release110/ARTIFACT_LOCK.json --source-root . --out ROOT_FROZEN_ARTIFACT_REVIEW.json
      - name: Rebuild locked source and check descriptions with the reviewed tools
        run: |
          python -m pip install --disable-pip-version-check 'hatchling==1.33.0' 'twine==7.0.0' 'packaging==26.3' 'readme-renderer==46.0'
          python release110/rebuild_frozen_source.py --source-root . --project-lock release110/ARTIFACT_LOCK.json --out "$RUNNER_TEMP/spillway110-rebuild"
          python -m twine check --strict dist/spillway_guard-1.1.0-py3-none-any.whl dist/spillway_guard-1.1.0.tar.gz
      - name: Install exactly the frozen wheel and run the public no-model example
        run: |
          python -m pip install --disable-pip-version-check dist/spillway_guard-1.1.0-py3-none-any.whl
          python -m pip check
          python -I - <<'PY'
          import hashlib, importlib.metadata, sys, zipfile
          from pathlib import Path
          from pydantic import BaseModel
          def deny(event, args):
              if event in {'socket.connect', 'socket.bind', 'socket.getaddrinfo', 'socket.sendto', 'subprocess.Popen', 'os.system'}:
                  raise AssertionError('No-model example forbids external execution: ' + event)
          sys.addaudithook(deny)
          from spillway_guard import E2gV2Guard, Guard, Policy, ResourceContracts, file_access_mode
          import spillway_guard
          assert spillway_guard.__version__ == importlib.metadata.version('spillway-guard') == '1.1.0'
          package = Path(spillway_guard.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix))
          with zipfile.ZipFile('dist/spillway_guard-1.1.0-py3-none-any.whl') as archive:
              members = [n for n in archive.namelist() if n.startswith('spillway_guard/')]
              assert len(members) == 35
              assert all(hashlib.sha256((package.parent.parent / n).read_bytes()).digest() == hashlib.sha256(archive.read(n)).digest() for n in members)
          class Email(BaseModel):
              sender: str
              body: str
          g = Guard(user_task='Reply to the latest email from Alice.')
          assert g.policy == Policy.enhanced_014() and g.judge is None
          g.check_call('get_latest_email', {})
          g.observe_tool_return('get_latest_email', {}, Email(sender='alice@example.com', body='The approved draft is ready.'))
          assert g.check_call('send_email', {'recipients': ['alice@example.com']}).label == 'allow_schema_identity_target'
          assert ResourceContracts().fields == ()
          e2g = E2gV2Guard('Read the notes and check repository status.', tool_names=('read_file', 'run_terminal'))
          assert e2g.check_call('read_file', {'path': 'notes.txt'}).allowed
          assert e2g.check_call('run_terminal', {'command': 'git status'}).allowed
          assert e2g.check_call('read_file', {'path': '.env'}).label == 'block_file_policy_private'
          assert file_access_mode('requirements.txt') == 'read_only'
          print('Installed1.1.0/public example PASS; model calls0')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-distributions-110
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spillway-guard
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-distributions-110
          path: dist/
      - name: Recheck frozen distribution hashes and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected = {'spillway_guard-1.1.0-py3-none-any.whl': 'a047c87853638b7faee3c4b32a36d2d8456f5db098fbdaf93416e6bb545a4209', 'spillway_guard-1.1.0.tar.gz': '0660f75d6a8793dc86c05677c42b22cae4d9a563b7ec512f9ad46cde821946f1'}
          files = {p.name: p for p in Path('dist').iterdir()}
          assert files.keys() == expected.keys()
          assert all(hashlib.sha256(files[n].read_bytes()).hexdigest() == h for n, h in expected.items())
          base = 'repos/saintmachines/spillway/'
          ref = json.loads(subprocess.check_output(['gh', 'api', base + 'git/ref/tags/v1.1.0']))['object']
          assert ref['type'] == 'tag' and ref['sha'] == os.environ['TAG_OBJECT_SHA']
          tag = json.loads(subprocess.check_output(['gh', 'api', base + 'git/tags/' + ref['sha']]))
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['EXPECTED_COMMIT']
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
